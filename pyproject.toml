[project]
name = "agentgym"
version = "0.1.0"
description = "A verifiable Kubernetes incident gym for post-training and serving tool-using agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings",
    "httpx",
    "kubernetes",
    "pyyaml",
    "orjson",
    "jinja2",
    "tenacity",
    "typer",
    "rich",
    "structlog",
    "numpy",
    "prometheus-client",
    "mcp",
    "jsonschema",
]

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "trl", "bitsandbytes", "accelerate", "datasets", "mlflow"]
serve = ["vllm"]
dev = ["pytest", "pytest-asyncio", "anyio", "ruff"]

[project.scripts]
agentgym = "agentgym.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501  line length is handled by the formatter's 100-col target, not enforced
# B008   function calls in argument defaults are the typer/dataclass idiom here
# UP042  `str, Enum` is deliberate: members must compare equal to their string value so
#        verdicts and tiers round-trip through JSON trajectories unchanged
ignore = ["E501", "B008", "UP042"]
