[project]
name = "agentgym"
version = "0.1.0"
description = "A verifiable Kubernetes incident gym for post-training and serving tool-using agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings",
    "httpx",
    "kubernetes",
    "pyyaml",
    "orjson",
    "jinja2",
    "tenacity",
    "typer",
    "rich",
    "structlog",
    "numpy",
    "prometheus-client",
    "mcp",
    "jsonschema",
]

[project.optional-dependencies]
# safetensors is imported directly by scripts/scale_adapter.py and train/episode_grpo.py.
# It arrives transitively with transformers today, which is why its absence went unnoticed;
# a transitive dependency you import directly is one upstream release away from breaking.
train = ["torch", "transformers", "peft", "trl", "bitsandbytes", "accelerate", "datasets",
         "mlflow", "safetensors"]
serve = ["vllm"]
# boto3 is a real runtime dependency of storage.S3Store, not a development convenience:
# `pip install -e .` followed by AGENTGYM_ARTIFACT_URI=s3://... raised ImportError.
cloud = ["boto3"]
# moto is what makes test_storage.py runnable. Without it `pip install -e .[dev]` produced
# a checkout whose own test suite could not pass.
dev = ["pytest", "pytest-asyncio", "anyio", "ruff", "moto", "boto3"]

[project.scripts]
agentgym = "agentgym.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501  line length is handled by the formatter's 100-col target, not enforced
# B008   function calls in argument defaults are the typer/dataclass idiom here
# UP042  `str, Enum` is deliberate: members must compare equal to their string value so
#        verdicts and tiers round-trip through JSON trajectories unchanged
ignore = ["E501", "B008", "UP042"]
