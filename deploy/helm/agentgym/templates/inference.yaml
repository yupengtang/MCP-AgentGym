{{- if .Values.inference.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentgym.fullname" . }}-inference
  labels:
    {{- include "agentgym.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  replicas: {{ .Values.inference.replicas }}
  selector:
    matchLabels:
      {{- include "agentgym.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inference
  template:
    metadata:
      labels:
        {{- include "agentgym.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "agentgym.serviceAccountName" . }}
      {{- with .Values.inference.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inference.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --model
            - {{ .Values.inference.model | quote }}
            - --max-model-len
            - {{ .Values.inference.maxModelLen | quote }}
            - --gpu-memory-utilization
            - {{ .Values.inference.gpuMemoryUtilization | quote }}
            # The training-time chat template, so the prompt the model is served is
            # byte-identical to the one it was trained on.
            - --chat-template
            - /app/agentgym_chat_template.jinja
            {{- if .Values.inference.adapters }}
            - --enable-lora
            - --max-lora-rank
            - "32"
            - --lora-modules
            {{- range $name, $path := .Values.inference.adapters }}
            - {{ printf "%s=%s" $name $path | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          resources: {{- toYaml .Values.inference.resources | nindent 12 }}
          # A model server takes minutes to load weights: startupProbe grants that
          # budget, while readiness stays tight once it is up.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentgym.fullname" . }}-inference
  labels:
    {{- include "agentgym.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  selector:
    {{- include "agentgym.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentgym.fullname" . }}-inference
  labels: {{- include "agentgym.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentgym.fullname" . }}-inference
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Model servers are expensive to start; do not thrash them.
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentgym.fullname" . }}-inference
  labels: {{- include "agentgym.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentgym.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inference
  policyTypes: [Ingress]
  ingress:
    # Only the gateway may reach the engine. Nothing else in the cluster can send it
    # prompts, which is the point of putting a gateway in front of it at all.
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentgym.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- end }}
